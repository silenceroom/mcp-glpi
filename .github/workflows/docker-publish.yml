name: Docker image

# Builds the image and publishes it to the GitHub Container Registry.
#
#   push to main      -> :latest + :sha-<short>   (latest tracks the trunk)
#   push tag v3.5.0   -> :3.5.0 + :3.5 + :latest  (tag must match package.json)
#   pull request      -> build only, nothing pushed
#   manual run        -> same as a push to main
#
# Every path runs the tests and the type-check first; a red build never reaches
# the registry.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# A newer commit on the same ref makes the running build pointless.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # tsx (which runs the tests) transpiles without type-checking, so tsc is
      # the only thing here that would catch a type error before the image build.
      - run: npm run build
      - run: npm test
      - name: Check the versions agree
        run: |
          pkg=$(node -p 'require("./package.json").version')
          src=$(sed -n "s/^const SERVER_VERSION = '\(.*\)';$/\1/p" src/index.ts)

          if [ "$pkg" != "$src" ]; then
            echo "::error::package.json ($pkg) and SERVER_VERSION ($src) disagree — bump them together"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "${GITHUB_REF_NAME#v}" != "$pkg" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi
          echo "version $pkg checks out"

  image:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read the version from package.json
        id: version
        run: echo "value=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=pr
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v7
        with:
          context: .
          # amd64 only for pull requests: emulated arm64 roughly doubles the
          # build time and a PR publishes nothing.
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          # Fork PRs cannot write the Actions cache, so only export from branches.
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max' || '' }}
